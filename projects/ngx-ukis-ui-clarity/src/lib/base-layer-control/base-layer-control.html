@for (group of layergroups | reverse; track group) {
  <div class="list-item">
    @if (isLayerGroup(group)) {
      <ngx-ukis-layerentry-group [layersSvc]="layersSvc" [mapState]="mapStateSvc" [group]="group"
      [layerGroups]="layergroups"></ngx-ukis-layerentry-group>
    }
    @if (!isLayerGroup(group)) {
      <ngx-ukis-layerentry [layerGroups]="layergroups" [expanded]="false" [layersSvc]="layersSvc"
      [mapState]="mapStateSvc" [layer]="group"></ngx-ukis-layerentry>
    }
  </div>
}
