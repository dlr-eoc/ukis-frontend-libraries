<main class="content-area map-view">
  <ngx-ukis-map-ol [layersSvc]="layerSvc" [mapState]="mapStateSvc" [controls]="controls" id="olMap"></ngx-ukis-map-ol>
</main>

<clr-vertical-nav [clrVerticalNavCollapsible]="true" [clr-nav-level]="2">
  <clr-vertical-nav-group [clrVerticalNavGroupExpanded]="true" class="layers" title="layers">
    <cds-icon shape="layers" clrVerticalNavIcon></cds-icon>
    Layers
    <clr-vertical-nav-group-children class="padding title-ellipsis">
      <ngx-ukis-layer-control [layersSvc]="layerSvc" [mapStateSvc]="mapStateSvc"></ngx-ukis-layer-control>
    </clr-vertical-nav-group-children>
  </clr-vertical-nav-group>
</clr-vertical-nav>
