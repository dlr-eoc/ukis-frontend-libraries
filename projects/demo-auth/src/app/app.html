<clr-main-container>
  @if (ui.alert()) {
    <ngx-ukis-global-alert [(alert)]="ui.alert"></ngx-ukis-global-alert>
  }
  @if (ui.progress()) {
    <ngx-ukis-global-progress [(progress)]="ui.progress"></ngx-ukis-global-progress>
  }
  <ngx-ukis-cookie-alert [text]="'my alert text'" [link]="'link to privacy'"></ngx-ukis-cookie-alert>

  <ngx-ukis-header [ukis-title]="title()" [ukis-short-title]="shortTitle()" [ukis-version]="version">
    @if (!userService.isloggedIn()) {
      <a routerLink="/login" routerLinkActive="active"
      class="nav-link nav-text header-nav-el">Login</a>
    }
    @if (userService.isloggedIn()) {
      <a routerLink="/user" routerLinkActive="active"
      class="nav-link nav-text header-nav-el">User</a>
    }
    <a routerLink="/map" routerLinkActive="active" class="nav-link nav-text header-nav-el">Map</a>

  </ngx-ukis-header>
  <router-outlet></router-outlet>
</clr-main-container>
